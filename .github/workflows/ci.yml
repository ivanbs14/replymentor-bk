name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: replymentor_test
          POSTGRES_PASSWORD: replymentor_test
          POSTGRES_DB: replymentor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U replymentor_test -d replymentor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://replymentor_test:replymentor_test@localhost:5432/replymentor_test
      DATABASE_URL_TEST: postgresql://replymentor_test:replymentor_test@localhost:5432/replymentor_test
      JWT_SECRET: ci-only-secret-with-at-least-32-random-characters
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: 'false'
      COOKIE_SAME_SITE: lax
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run test:cov
      - run: npm run test:e2e -- --runInBand
      - run: npm run build
